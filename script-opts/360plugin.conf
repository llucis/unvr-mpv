enabled=no
# GPU decode acceleration: no (default), or a copy-back mpv hwdec mode
# such as auto-copy, nvdec-copy, vaapi-copy. "yes"/"auto" map to auto-copy.
hwdec=no
cycle_input=1
cycle_output=2
roll_left=u
roll_right=o
write_log=w
pitch_up=i
pitch_down=k
yaw_up=l
yaw_down=j
easy_crop=c
res_up=y
res_down=h
zoom_in==
zoom_out=-
wzoom_out=WHEEL_DOWN
wzoom_in=WHEEL_UP
reset_view=TAB
switch_stereo=r
switch_eye=t
switch_scaler=e
toggle_smooth=g
switch_bounds=b
# Cycle vertical (portrait) crop: off -> each aspect below -> off
vertical_crop=x
# Comma-separated portrait aspects for the crop cycle (W:H)
vertical_aspects=9:16,2:3,3:4,1:1
# Initial preview render height in pixels, snapped to 108px steps
# (432, 540, 648, ... up to 2160). Preview only; exports are always 1080p.
start_height=480
new_log_session=n
grab_mouse=mouse_btn0
mouse_pan=mouse_move
show_help=?
toggle_vr360=v
osc=no
fullscreen=yes
osd-font-size=30